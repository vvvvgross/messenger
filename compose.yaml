services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://messenger@postgres:5432/messenger?sslmode=disable"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_DB: messenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: